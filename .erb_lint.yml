---
glob: "app/views/**/*.{html,text}.erb"

linters:
  ClosingErbTagIndent:
    enabled: true

  ExtraNewline:
    enabled: true

  FinalNewline:
    enabled: true

  NoJavascriptTagHelper:
    enabled: true

  ParserErrors:
    enabled: true

  RightTrim:
    enabled: true
    enforced_style: "-"

  SelfClosingTag:
    enabled: true

  SpaceAroundErbTag:
    enabled: true

  SpaceIndentation:
    enabled: true

  SpaceInHtmlTag:
    enabled: true

  TrailingWhitespace:
    enabled: true

  Rubocop:
    enabled: true
    rubocop_config:
      inherit_from: .rubocop.yml

      Layout/FirstArgumentIndentation:
        Enabled: false # This just doesn't work well in erb. We want to indent wrt the opening <% tag

      Layout/InitialIndentation:
        Enabled: false

      Layout/LineLength:
        Enabled: false

      Layout/TrailingEmptyLines:
        Enabled: false

      Lint/UselessAssignment:
        Enabled: false

      Naming/FileName:
        Enabled: false

      Style/FrozenStringLiteralComment:
        Enabled: false
